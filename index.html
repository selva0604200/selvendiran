<!-- SCRIPTS: LENIS & GSAP -->
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- MEGA MENU SCRIPT -->
<script>
(() => {
  const items = [...document.querySelectorAll('.nav-links li.has-mega-menu')];
  const closeAll = except => items.forEach(item => {
    if (item !== except) {
      item.classList.remove('menu-open');
      item.querySelector(':scope > a')?.setAttribute('aria-expanded','false');
    }
  });
  items.forEach(item => {
    const trigger = item.querySelector(':scope > a');
    const menu = item.querySelector(':scope > .mega-menu');
    if(!trigger || !menu) return;
    trigger.setAttribute('aria-haspopup','true');
    trigger.setAttribute('aria-expanded','false');
    trigger.addEventListener('click', e => {
      if(window.matchMedia('(max-width: 767px)').matches){
        e.preventDefault();
        const open = item.classList.contains('menu-open');
        closeAll();
        if(!open){ item.classList.add('menu-open'); trigger.setAttribute('aria-expanded','true'); }
      }
    });
    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => closeAll()));
  });
  document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeAll(); document.activeElement?.blur(); } });
  document.addEventListener('click', e => { if(!e.target.closest('.nav-links li.has-mega-menu')) closeAll(); });
})();
</script>

<!-- ULTRA-SMOOTH CANVAS SCROLL ENGINE -->
<script>
gsap.registerPlugin(ScrollTrigger);

const isMobile = window.innerWidth <= 768;
const frameCount = 157; // Updated to 157 frames
const currentFrame = index => `frames/ezgif-frame-${(index + 1).toString().padStart(3, '0')}.jpg`;

// 1. Setup Lenis Smooth Scroll Driven by GSAP Ticker
const lenis = new Lenis({
    duration: isMobile ? 0.7 : 1.1,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    smoothWheel: true,
    touchMultiplier: 1.5
});

lenis.on('scroll', ScrollTrigger.update);

gsap.ticker.add((time) => {
    lenis.raf(time * 1000);
});
gsap.ticker.lagSmoothing(0);

// 2. Setup Canvas Context
const canvas = document.getElementById("video-canvas");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

const images = new Array(frameCount);
const sequence = { frame: 0 };

// Layout Dimensions Cache
let renderDims = { width: 0, height: 0, offsetX: 0, offsetY: 0 };
let firstFrameReady = false;

function calculateLayout(img) {
    if (!img || !img.naturalWidth) return;
    const canvasRatio = canvas.width / canvas.height;
    const imgRatio = img.naturalWidth / img.naturalHeight;
    let drawWidth = canvas.width, drawHeight = canvas.height, offsetX = 0, offsetY = 0;

    if (canvasRatio > imgRatio) {
        drawHeight = canvas.width / imgRatio;
        offsetY = (canvas.height - drawHeight) / 2;
    } else {
        drawWidth = canvas.height * imgRatio;
        offsetX = (canvas.width - drawWidth) / 2;
    }
    renderDims = { width: drawWidth, height: drawHeight, offsetX, offsetY };
}

function handleResize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Recalculate aspect fit layout using first loaded frame
    const sampleImg = images.find(img => img && img.complete && img.naturalWidth > 0);
    if (sampleImg) calculateLayout(sampleImg);
    renderCurrentFrame(true);
}
window.addEventListener("resize", handleResize);

// 3. Preload & Async Decode Image Sequence
for (let i = 0; i < frameCount; i++) {
    const img = new Image();
    img.src = currentFrame(i);
    
    if (img.decode) {
        img.decode().then(() => {
            images[i] = img;
            onFrameLoaded(img, i);
        }).catch(() => {
            images[i] = img;
            onFrameLoaded(img, i);
        });
    } else {
        img.onload = () => {
            images[i] = img;
            onFrameLoaded(img, i);
        };
    }
}

function onFrameLoaded(img, index) {
    if (!firstFrameReady && index === 0) {
        firstFrameReady = true;
        calculateLayout(img);
        renderCurrentFrame(true);
    }
}

// 4. Render Triggered Only on Frame Changes
let lastRenderedFrame = -1;

function renderCurrentFrame(force = false) {
    const frameIndex = Math.min(frameCount - 1, Math.max(0, Math.round(sequence.frame)));
    
    if (frameIndex !== lastRenderedFrame || force) {
        const img = images[frameIndex];
        if (img && img.complete && img.naturalWidth > 0) {
            if (!renderDims.width) calculateLayout(img);
            
            ctx.drawImage(
                img, 
                renderDims.offsetX, 
                renderDims.offsetY, 
                renderDims.width, 
                renderDims.height
            );
            lastRenderedFrame = frameIndex;
        }
    }
}

// 5. Fluid Frame Interpolation via ScrollTrigger
gsap.to(sequence, {
    frame: frameCount - 1,
    ease: "none",
    scrollTrigger: {
        trigger: document.body,
        start: "top top",
        end: "bottom bottom",
        scrub: 0.15, // Butter-smooth momentum scrubbing
        onUpdate: () => renderCurrentFrame()
    }
});

handleResize();
</script>
