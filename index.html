<script>
/* =========================================================
   ULTIMATE VIDEO SCRUBBER (PREVENTS BROWSER FREEZE)
========================================================= */
const video = document.getElementById("background-video");
const canvas = document.getElementById("video-canvas");
const ctx = canvas.getContext("2d");
const progressBar = document.getElementById("progress-bar");
const navbar = document.getElementById("navbar");

let targetTime = 0;
let isSeeking = false;
let videoReady = false;

/* Dynamically resize canvas to fill screen */
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    drawCanvasFrame();
}

/* Draw the video frame onto the canvas (Object-Fit: Cover style) */
function drawCanvasFrame() {
    if (!videoReady || !video.videoWidth) return;
    
    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;
    
    const hRatio = canvasWidth / video.videoWidth;
    const vRatio = canvasHeight / video.videoHeight;
    const ratio = Math.max(hRatio, vRatio);

    const cx = (canvasWidth - video.videoWidth * ratio) / 2;
    const cy = (canvasHeight - video.videoHeight * ratio) / 2;

    ctx.clearRect(0, 0, canvasWidth, canvasHeight);
    ctx.drawImage(
        video, 
        0, 0, video.videoWidth, video.videoHeight, 
        cx, cy, video.videoWidth * ratio, video.videoHeight * ratio
    );
}

/* Update target time based on scroll position */
function onScroll() {
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const progress = Math.max(0, Math.min(window.scrollY / maxScroll, 1));
    
    progressBar.style.width = `${progress * 100}%`;
    
    if (video.duration) {
        targetTime = progress * video.duration;
    }
    
    if (window.scrollY > 40) navbar.classList.add("scrolled");
    else navbar.classList.remove("scrolled");
}

/* The Animation Loop */
function loop() {
    // ONLY seek if the browser has finished decoding the last requested frame
    if (videoReady && !isSeeking) {
        const timeDiff = targetTime - video.currentTime;
        
        // If difference is large enough, request a new frame
        if (Math.abs(timeDiff) > 0.05) {
            isSeeking = true;
            // Easing function for a smooth transition between frames
            video.currentTime += timeDiff * 0.15; 
        }
    }
    requestAnimationFrame(loop);
}

/* Modern API for zero-latency frame drawing (Chrome/Edge/Safari) */
if ('requestVideoFrameCallback' in video) {
    const updateCanvas = () => {
        drawCanvasFrame();
        video.requestVideoFrameCallback(updateCanvas);
    };
    video.requestVideoFrameCallback(updateCanvas);
}

/* Video Event Listeners */
video.addEventListener("loadeddata", () => {
    videoReady = true;
    resizeCanvas();
    onScroll();
});

// Unlock the seeker ONLY when the browser successfully decoded the frame
video.addEventListener("seeked", () => {
    isSeeking = false;
    
    // Fallback for Firefox/Older browsers that don't support requestVideoFrameCallback
    if (!('requestVideoFrameCallback' in video)) {
        drawCanvasFrame(); 
    }
});

/* Window Event Listeners */
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", resizeCanvas);

/* Initialize */
requestAnimationFrame(loop);

/* =========================
   REVEAL ANIMATIONS
========================= */
const revealElements = document.querySelectorAll(".reveal");
const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
        if (entry.isIntersecting) entry.target.classList.add("visible");
    });
}, { threshold: 0.12 });

revealElements.forEach((element) => observer.observe(element));
</script>
